<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banjir — flood risk for your area</title>
<style>
  body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f4f8;color:#1f2937;margin:0;padding:1rem}
  .wrap{max-width:680px;margin:0 auto}
  h1{margin:0 0 .25rem;font-size:1.6rem}
  .sub{color:#4b5563;margin-bottom:1rem}
  .bm{color:#6b7280;font-size:.875rem;margin-top:.2rem}
  .search{display:flex;gap:.5rem;margin-bottom:1rem}
  input{flex:1;padding:.75rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:1rem}
  button{padding:.75rem 1rem;border:0;border-radius:.5rem;background:#0ea5e9;color:#fff;font-size:1rem;cursor:pointer}
  .card{background:#fff;border-radius:.75rem;padding:1rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .title{font-weight:700;margin-bottom:.5rem}
  .muted{color:#6b7280;font-size:.875rem}
  .badge{display:inline-block;padding:.25rem .5rem;border-radius:.375rem;font-size:.75rem;font-weight:700}
  .bg-red{background:#fee2e2;color:#991b1b}
  .bg-orange{background:#ffedd5;color:#9a3412}
  .bg-amber{background:#fef3c7;color:#92400e}
  .bg-green{background:#d1fae5;color:#065f46}
  .bg-gray{background:#e5e7eb;color:#374151}
  .station{padding:.75rem;border:1px solid #e5e7eb;border-radius:.5rem;margin-bottom:.5rem}
  .checklist li{margin-bottom:.35rem}
  .pitch{background:#111827;color:#fff}
  .pitch button{background:#10b981}
  #loading{display:none;color:#0ea5e9}
  .period{margin-bottom:.4rem}
  .areas{font-size:.8rem;color:#4b5563}
  .lang{display:flex;gap:.5rem;margin-bottom:1rem}
  .lang button{background:#e5e7eb;color:#374151;font-size:.875rem;padding:.4rem .75rem}
  .lang button.active{background:#111827;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <h1>Banjir</h1>
  <p class="sub" id="tagline"></p>
  <div class="lang" id="lang">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="bm">BM</button>
    <button type="button" data-lang="zh">中文</button>
  </div>
  <form id="form" class="search">
    <input id="place" autocomplete="off">
    <button type="button" id="mic">🎤</button>
    <button type="submit" id="check"></button>
  </form>
  <div id="loading"></div>
  <div id="output"></div>
  <div id="pitch" class="card pitch" style="display:none">
    <div class="title" id="pitchTitle"></div>
    <div id="pitchText"></div>
    <button id="speak"></button>
  </div>
</div>

    sourceNews: "Google News RSS：新闻",
    footerNote: "最近站点按县名匹配，非 GPS。「没有数据」不会显示为「安全」。",

    daysAgo: "{{n}} 天前",
    risk: "风险",
    state: "州属",
    generated: "生成于",
    source: "来源",
    viewAll: "查看全部",
    malaysia: "马来西亚",
    unknown: "未知",
    placeNotFound: "找不到「{{place}}」。{{suffix}}",
    placeNotFoundSuffix: "请试试以下邻近地区：",
    people: "人",
    areas: "地区",
    status: {DANGER:'危险', WARNING:'警告', ALERT:'警戒', NORMAL:'正常', OFFLINE:'离线', UNKNOWN:'未知'},
    templateFallback: "模板备用"
  }
};

const VOICE = {en:'en-GB', bm:'ms-MY', zh:'zh-CN'};
const RECOG = {en:'en-MY', bm:'ms-MY', zh:'zh-CN'};

let lang = localStorage.getItem('banjir-lang') || 'en';
let lastData = null;
let lastPitch = null;

const form = document.getElementById('form');
const place = document.getElementById('place');
const output = document.getElementById('output');
const loading = document.getElementById('loading');
const pitch = document.getElementById('pitch');
const pitchText = document.getElementById('pitchText');
const pitchTitle = document.getElementById('pitchTitle');
const speakBtn = document.getElementById('speak');
const tagline = document.getElementById('tagline');
const checkBtn = document.getElementById('check');
const langBtns = document.querySelectorAll('#lang button');
const mic = document.getElementById('mic');

function escapeHtml(str){
  if(str==null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function t(key, params){
  const s = (i18n[lang] && i18n[lang][key]) || i18n.en[key] || key;
  if(!params) return s;
  return Object.entries(params).reduce((acc,[k,v])=>acc.replace(new RegExp('{{'+k+'}}','g'), v), s);
}

function statusLabel(status){
  return (i18n[lang].status[status] || i18n.en.status[status] || t('unknown'));
}

function setLang(l){
  lang = l;
  localStorage.setItem('banjir-lang', lang);
  document.documentElement.lang = lang==='zh'?'zh-CN':lang==='bm'?'ms':'en';
  langBtns.forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  tagline.textContent = t('tagline');
  place.placeholder = t('placeholder');
  checkBtn.textContent = t('check');
  loading.textContent = t('loading');
  pitchTitle.textContent = t('letBanjirPitch');
  speakBtn.textContent = t('narrate');
  if(lastData) render(lastData);
  if(lastPitch) renderPitch();
}

langBtns.forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

async function getStatus(q){
  loading.style.display='block'; output.innerHTML=''; pitch.style.display='none';
  try{
    const res = await fetch('/api/status?place='+encodeURIComponent(q));
    const data = await res.json();
    lastData = data;
    render(data);
  }finally{ loading.style.display='none'; }
}

function badge(status){
  const cls={DANGER:'bg-red',WARNING:'bg-orange',ALERT:'bg-amber',NORMAL:'bg-green',UNKNOWN:'bg-gray',OFFLINE:'bg-gray'}[status]||'bg-gray';
  return `<span class="badge ${cls}">${statusLabel(status)}</span>`;
}

function timeAgo(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const diff = Math.max(0, Math.floor((Date.now() - d) / 1000));
  if(diff < 60) return t('justNow');
  if(diff < 3600) return t('minutesAgo', {n: Math.floor(diff/60)});
  if(diff < 86400) return t('hoursAgo', {n: Math.floor(diff/3600)});
  if(diff < 604800) return t('daysAgo', {n: Math.floor(diff/86400)});
  return d.toLocaleDateString();
}

function fmtTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function summaryText(obj){
  return escapeHtml(obj && obj[lang] || obj && obj.en || '');
}

function render(data){
  if(data.place_not_found){
    const msg = escapeHtml(data['message_'+lang] || data.message_en);
    output.innerHTML = `<div class="card"><div class="title">${msg}</div>` +
      (data.suggestions.length? `<ul>${data.suggestions.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ul>`:'')+'</div>';
    return;
  }
  const e=data.explanation||{};
  let html=`<div class="card"><div class="title">${summaryText(e)}</div>`;
  html+=`<div class="muted">${t('risk')}: ${badge(data.emergency.risk_level)} · ${t('state')}: ${escapeHtml(data.resolved_state||'-')}`;
  if(e.fallback===false) html+=` · Model: ${escapeHtml(e.model)}`;
  if(e.fallback===true) html+=` · <span class="bg-amber badge">${t('templateFallback')}</span> ${escapeHtml(e.model||'')}`;
  if(e.llm_error) html+=` · <span class="bg-red badge">error</span> ${escapeHtml(e.llm_error)}`;
  html+=`</div><div class="muted">${t('generated')}: ${escapeHtml(data.generated_at)}</div></div>`;

  html+=`<div class="card"><div class="title">${t('nearestStations')}</div>`;
  for(const s of data.jps.stations.slice(0,5)){
    const level = s.level==null ? t('noReading') : t('levelValue', {level: s.level});
    const th = [s.normal!=null&&`N:${s.normal}`, s.alert!=null&&`A:${s.alert}`, s.warning!=null&&`W:${s.warning}`, s.danger!=null&&`D:${s.danger}`].filter(Boolean).join(' · ');
    html+=`<div class="station"><strong>${escapeHtml(s.name)}</strong> [${escapeHtml(s.district)}] ${badge(s.status)}<br>`;
    html+=`${t('level')}: <b>${escapeHtml(level)}</b> · ${t('thresholds')}: ${th||t('none')}<br>`;
    html+=`${t('updated')}: ${escapeHtml(s.updated||'-')} · ${t('trend')}: ${escapeHtml(s.trend||'-')}</div>`;
  }
  html+=`<div class="muted">${t('source')}: ${escapeHtml(data.jps.source)} · ${escapeHtml(data.jps.fetched_at)}${data.jps.cached?' (cached)':''}</div></div>`;

  html+=`<div class="card"><div class="title">${t('metWarnings', {state: escapeHtml(data.resolved_state||t('malaysia'))})}</div>`;
  if(data.met_warnings.length){
    for(const w of data.met_warnings.slice(0,3)){
      const title = escapeHtml(w['title_'+lang] || w.title_en || '-');
      html+=`<div class="station"><b>${title}</b><br>`;
      html+=`<small>${escapeHtml(w.issued||'')} → ${escapeHtml(w.valid_to||'')}</small><br>`;
      html+=`<div class="areas">${t('areas')}: ${(w.areas||[]).join('; ')||'-'}</div></div>`;
    }
  }else if(data.met_warnings_all_count){
    const types = data.met_warnings_all_summary.map(w=>w.title_en).filter((v,i,a)=>a.indexOf(v)===i).join(', ');
    const areas = data.met_warnings_all_summary.map(w=>w.areas.join('; ')).join('; ');
    html+=`<p>${t('noMetState', {state: escapeHtml(data.resolved_state||t('malaysia')), count: data.met_warnings_all_count, types: escapeHtml(types), areas: escapeHtml(areas), viewAll: t('viewAll')})}</p>`;
  }else html+=`<p>${t('noWarnings')}</p>`;
  html+=`<div class="muted">${t('source')}: MET Malaysia via data.gov.my</div></div>`;

  const f=data.met_forecast;
  html+=`<div class="card"><div class="title">${t('next24h')}</div>`;
  if(f){
    const summary = escapeHtml(f['summary_'+lang] || f.summary_en || '');
    const when = escapeHtml(f['when_'+lang] || f.when_en || '');
    html+=`<p>${escapeHtml(f.location)} · ${summary} · ${when} · ${f.min_temp}-${f.max_temp}°C</p>`;
    for(const p of (f.periods||[])){
      const pwhen = escapeHtml(p['when_'+lang] || p.when_en || '');
      const psum = escapeHtml(p['summary_'+lang] || p.summary_en || '');
      html+=`<div class="period"><b>${pwhen}</b>: ${psum}</div>`;
    }
  } else html+=`<p>${t('noForecast')}</p>`;
  html+=`<div class="muted">${t('source')}: MET Malaysia</div></div>`;

  if(data.news && data.news.length){
    html+=`<div class="card"><div class="title">${t('latestNews')}</div>`;
    html+=`<div class="muted" style="margin-bottom:.5rem">${t('newsDisclaimer')}</div>`;
    for(const n of data.news.slice(0,5)){
      html+=`<div class="station"><small class="muted">${escapeHtml(n.publisher)} · ${timeAgo(n.published)}</small><br>`;
      html+=`<a href="${escapeHtml(n.url)}" target="_blank">${escapeHtml(n.title)}</a></div>`;
    }
    html+=`<div class="muted">${t('source')}: Google News RSS</div></div>`;
  }

  html+=`<div class="card"><div class="title">${t('whatToDo')}</div><ul class="checklist">`;
  for(const c of data.emergency.checklist.slice(0,6)){
    const item = escapeHtml(c[lang] || c.en || '');
    html+=`<li><b>${item}</b></li>`;
  }
  html+='</ul></div>';

  html+=`<div class="card"><div class="title">${t('reliefCentres')}</div>`;
  if(data.relief_centres.available){
    if(data.relief_centres.centres.length){
      for(const c of data.relief_centres.centres){
        html+=`<div class="station">${escapeHtml(c.name)} · ${escapeHtml(c.district||'')} · ${c.evacuees||0} ${t('people')}</div>`;
      }
    }else if(data.relief_centres.national){
      const n=data.relief_centres.national;
      html+=`<p>${t('noOpenRelief', {state: escapeHtml(data.resolved_state||'-')})} ` +
        `${t('reliefNational', {count: n.count, states: escapeHtml(n.states.join(', ')), types: escapeHtml(n.disaster_types.join(', '))})}. ` +
        `Source: JKM InfoBencana</p>`;
    }else html+=`<p>${t('noOpenRelief', {state: escapeHtml(data.resolved_state||'-')})}</p>`;
  }else{
    html+=`<p>${t('reliefUnavailable', {reason: escapeHtml(data.relief_centres.reason||t('notAvailable')), url: data.relief_centres.dashboard_url})}</p>`;
  }
  html+='</div>';

  html+=`<div class="card"><div class="title">${t('dataSources')}</div>`;
  html+=`<div class="muted">${t('sourceJps')} · ${t('updated')} ${fmtTime(data.jps.latest_station_update)}</div>`;
  html+=`<div class="muted">${t('sourceMet')} · ${t('updated')} ${f ? fmtTime(f.fetched_at) : '—'}</div>`;
  html+=`<div class="muted">${t('sourceJkm')} · ${t('updated')} ${fmtTime(data.relief_centres.fetched_at)}</div>`;
  html+=`<div class="muted">${t('sourceHotlines')} · ${t('updated')} ${fmtTime(data.generated_at)}</div>`;
  html+=`<div class="muted">${t('sourceNews')} · ${t('updated')} ${data.news && data.news[0] ? fmtTime(data.news[0].published) : '—'}</div>`;
  html+=`<p class="bm">${t('footerNote')}</p>`;
  html+=`</div>`;

  output.innerHTML=html;
  pitch.style.display='block';
}

form.onsubmit=(ev)=>{ev.preventDefault(); const q=place.value.trim(); if(!q){ place.focus(); return; } getStatus(q);};

if('webkitSpeechRecognition' in window){
  const rec=new webkitSpeechRecognition(); rec.interimResults=false;
  mic.onclick=()=>{rec.lang=RECOG[lang]||'en-MY'; rec.start();};
  rec.onresult=(e)=>{place.value=e.results[0][0].transcript; getStatus(place.value);};
}

function renderPitch(){
  if(!lastPitch) return;
  const text = escapeHtml(lastPitch['pitch_'+lang] || lastPitch.pitch_en);
  pitchText.innerHTML=`<p>${text}</p>`;
}

function speak(){
  if(!('speechSynthesis' in window) || !lastPitch) return;
  const text = lastPitch['pitch_'+lang] || lastPitch.pitch_en;
  const u=new SpeechSynthesisUtterance(text); u.lang=VOICE[lang]||'en-GB';
  speechSynthesis.speak(u);
}

speakBtn.onclick=()=>{
  if(lastPitch) speak();
};

pitch.querySelector('#speak').onclick=async()=>{
  const q=place.value.trim();
  if(!q){ place.focus(); return; }
  const res=await fetch('/api/pitch?place='+encodeURIComponent(q));
  const d=await res.json();
  lastPitch=d;
  renderPitch();
  speak();
};

setLang(lang);
</script>
</body>
</html>
